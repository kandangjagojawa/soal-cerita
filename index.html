<!DOCTYPE html>
<html lang="jv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HC0LWB9G6X"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HC0LWB9G6X');
    </script>
  
  <title>Crita Aksara Jawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 id="ui-title" class="aksara-jawa"></h1>
    <div class="header-controls">
      <div class="story-selector">
        <label for="storySelect" id="ui-label-story" class="aksara-jawa"></label>
        <select id="storySelect"></select>
      </div>
      <div class="paugeran-selector">
        <span id="ui-label-paugeran" class="aksara-jawa"></span>
        <div class="paugeran-options">
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kbj" checked>
            <span>Paugeran KBJ</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="sriwedari">
            <span>Paugeran Sriwedari</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kawi">
            <span>Cara Kawi (Mardi Kawi)</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kaj_simplified">
            <span>KAJ Simplified</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kaj_tradisional">
            <span>KAJ Tradisional</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="story-card">
      <h2 id="story-title" class="aksara-jawa"></h2>
      <article id="story-content" class="aksara-jawa story-text"></article>
      
      <div class="story-actions">
        <button id="btn-toggle-latin" class="btn-latin">Latin</button>
        <span id="latin-timer-info" class="latin-timer-info" style="display: none;">
          Setelah <span id="latin-countdown">30</span> detik, Latin akan disembunyikan.
        </span>
      </div>

      <article id="story-latin-content" class="story-latin-text" style="display: none;"></article>
    </section>

    <section class="questions-card">
      <h3 id="ui-questions-title" class="aksara-jawa"></h3>
      <div id="questions-container"></div>

      <div class="navigation-area">
        <button id="next-story-btn" class="aksara-jawa btn" style="display: none;"></button>
      </div>
    </section>
  </main>

  <!-- Modal Pop-up Skor -->
  <div id="score-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <p id="modal-score-text" class="aksara-jawa modal-text"></p>
      <div id="modal-score-fraction" class="aksara-jawa modal-fraction"></div>
      <button id="modal-next-btn" class="aksara-jawa modal-btn"></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
